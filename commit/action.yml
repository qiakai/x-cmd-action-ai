name: ai/commit
description: |
  Conventional Commits compliance check + auto-generate commit message from diff.

  Local equivalent: x ai commit

  Requires the provider token as caller-side env (e.g.
  MINIMAX_API_KEY) — composite action steps cannot reference the
  secrets context directly.

inputs:
  mode:
    description: 'check (validate existing msg) or generate (write new msg).'
    required: true

runs:
  using: composite
  steps:
    - uses: x-cmd-action/x-cmd@v1

    - uses: x-cmd-action/this-repo@v1


    - name: run ai commit
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
      run: bash "${{ github.action_path }}/commit.sh"