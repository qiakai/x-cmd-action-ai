name: ai/review
description: |
  AI PR code review. Reads PR diff, generates structured review (security,
  style, suggestions). Pure shell.

  Local equivalent: x ai review

inputs:
  model:
    description: 'AI model to use.'
    required: false
    default: 'minimax'

runs:
  using: composite
  steps:
    - uses: x-cmd-action/x-cmd@v1

    - uses: x-cmd-action/this-repo@v1

    - name: configure api key
      if: env.MINIMAX_API_KEY != ''
      shell: bash
      env:
        MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      run: x minimax --cfg apikey="$MINIMAX_API_KEY"

    - name: run ai review
      shell: bash
      env:
        MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        INPUT_MODEL: ${{ inputs.model }}
        GH_TOKEN: ${{ github.token }}
        PR_NUM: ${{ github.event.pull_request.number }}
        PR_DIFF: ${{ github.event.pull_request.diff_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash "${{ github.action_path }}/review.sh"