name: ai/reply
description: |
  React + reply when a configurable keyword is mentioned in issue/comment.
  Supports static reply or AI-generated reply via x ai reply (x-cmd resolves
  the provider/credentials, e.g. MINIMAX_API_KEY, internally).
  Strict word-boundary match. Per-target reaction dedupe.
  Concurrency-safe: single in-flight + single pending.

  Local equivalent: x ai reply

inputs:
  keyword:
    description: 'Trigger keyword (default @x). Word-boundary matched.'
    required: false
    default: '@x'
  reaction:
    description: 'Reaction name (eyes, rocket, +1, heart, etc.).'
    required: false
    default: 'eyes'
  comment:
    description: 'Static reply comment body (used when use_ai is false).'
    required: false
    default: '👀 on it'
  use_ai:
    description: 'Generate reply via x ai reply instead of using static comment.'
    required: false
    default: 'false'
  prompt:
    description: |
      Inline extra guidance prepended to the AI input. Optional — the
      issue-safety rules are built into `x ai reply` and always apply.
    required: false
    default: ''
  prompt-file:
    description: |
      Path to a markdown file (relative to the action's repo root or the
      workflow's checkout) holding extra guidance. Used when `prompt` is
      empty. Ignored if the file is not found.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: x-cmd-action/x-cmd@v1
      with:
        stream: x7
      env:
        # x7 is public — clone over https instead of the get
        # script's default git@github.com (no SSH keys on runners).
        ___X_CMD_GET_GITPROVIDER: 'https://github.com/'

    - uses: x-cmd-action/this-repo@v1

    - name: run ai reply
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE_NUM: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        COMMENT_ID: ${{ github.event.comment.id }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        INPUT_KEYWORD: ${{ inputs.keyword }}
        INPUT_REACTION: ${{ inputs.reaction }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_USE_AI: ${{ inputs.use_ai }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_PROMPT_FILE: ${{ inputs.prompt-file }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: bash "${{ github.action_path }}/reply.sh"