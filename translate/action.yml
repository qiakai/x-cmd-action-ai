name: ai/translate
description: |
  AI translation of Markdown / i18n files.

  Local equivalent: x ai translate

inputs:
  source:
    description: 'Source file path (relative to repo root).'
    required: true
  target:
    description: 'Target language code (zh, ja, fr, etc.).'
    required: true

runs:
  using: composite
  steps:
    - uses: x-cmd-action/x-cmd@v1

    - uses: x-cmd-action/this-repo@v1


    - name: run ai translate
      shell: bash
      env:
        MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_TARGET: ${{ inputs.target }}
      run: bash "${{ github.action_path }}/translate.sh"