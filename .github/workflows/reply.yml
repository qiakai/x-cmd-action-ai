name: reply

# Live test: when @x is mentioned in an issue/comment, react + AI reply via MiniMax.

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:

concurrency:
  group: aireply-bot
  cancel-in-progress: false
  # queue omitted -> defaults to 'single' (last pending wins)

jobs:
  reply:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: qiakai/x-cmd-action-ai/reply@feat/ai-reply
        with:
          keyword: '@x'
          reaction: eyes
          use_ai: 'true'
          provider: 'minimax'
        env:
          MINIMAX_TOKEN: ${{ secrets.MINIMAX_TOKEN }}
