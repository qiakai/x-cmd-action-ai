name: ai/spec
description: |
  Auto-fill RFC templates for features; extract post-mortem from closed bugs.

  Local equivalent: x ai spec

  Requires the provider token as caller-side env (e.g.
  MINIMAX_API_KEY) — composite action steps cannot reference the
  secrets context directly.

inputs:
  mode:
    description: 'rfc (auto-fill RFC template) or postmortem (extract from closed bug).'
    required: true

runs:
  using: composite
  steps:
    - uses: x-cmd-action/x-cmd@v1

    - uses: x-cmd-action/this-repo@v1


    - name: run ai spec
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        GH_TOKEN: ${{ github.token }}
        ISSUE_NUM: ${{ github.event.issue.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash "${{ github.action_path }}/spec.sh"