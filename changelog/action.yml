name: ai/changelog
description: |
  Generate weekly changelog from closed issues + merged PRs.

  Local equivalent: x ai changelog

inputs:
  days:
    description: 'Look back N days (default 7 = weekly).'
    required: false
    default: '7'
  model:
    description: 'AI model to use.'
    required: false
    default: 'minimax'

runs:
  using: composite
  steps:
    - uses: x-cmd-action/x-cmd@v1

    - uses: x-cmd-action/this-repo@v1

    - name: configure api key
      if: env.MINIMAX_API_KEY != ''
      shell: bash
      env:
        MINIMAX_API_KEY: ${{ secrets.MINIMAX_TOKEN }}
      run: x minimax --cfg apikey="$MINIMAX_API_KEY"

    - name: run ai changelog
      shell: bash
      env:
        MINIMAX_API_KEY: ${{ secrets.MINIMAX_TOKEN }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_DAYS: ${{ inputs.days }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash "${{ github.action_path }}/changelog.sh"