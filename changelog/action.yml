name: ai/changelog
description: |
  Generate weekly changelog from closed issues + merged PRs.

  Local equivalent: x ai changelog

  Requires the provider token as caller-side env (e.g.
  MINIMAX_API_KEY) — composite action steps cannot reference the
  secrets context directly.

inputs:
  days:
    description: 'Look back N days (default 7 = weekly).'
    required: false
    default: '7'

runs:
  using: composite
  steps:
    - uses: x-cmd-action/x-cmd@v1
      with:
        stream: x7
      env:
        # x7 is public — clone over https instead of the get
        # script's default git@github.com (no SSH keys on runners).
        ___X_CMD_GET_GITPROVIDER: 'https://github.com/'

    - uses: x-cmd-action/this-repo@v1


    - name: run ai changelog
      shell: bash
      env:
        INPUT_DAYS: ${{ inputs.days }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash "${{ github.action_path }}/changelog.sh"